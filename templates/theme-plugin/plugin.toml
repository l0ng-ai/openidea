# A theme plugin is data only: no `wasm`, no permissions, nothing to compile.
# Rename the id, name and files when you start your own theme from this template.
id = "theme-harbor-night"
name = "Harbor Night Theme"
version = "1.0.0"
description = "Example dark theme: slate surfaces, a teal accent and a warm syntax palette."
authors = ["OpenIDEA contributors"]
change-notes = "1.0.0 — first release."
openidea-api = "0.1"

# One entry per theme. `editor-scheme` is optional: its tokens are merged over
# the theme's (IntelliJ's .theme.json + .icls pair).
[[contributes.themes]]
path = "themes/harbor-night.theme.json"
editor-scheme = "themes/harbor-night.scheme.json"
