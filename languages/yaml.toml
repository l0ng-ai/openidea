id = "yaml"
name = "YAML"
formatter = { tool = "prettier", parser = "yaml", range = false }
extensions = ["yaml", "yml"]
filenames = [".clang-format", ".clang-tidy", ".clangd", ".gemrc", "pnpm-lock.yaml", "CITATION.cff"]
first-line = "^%YAML"
line-comment = "#"
indent = { tab-size = 2, insert-spaces = true }
ui-mode = "YAML"
tree-sitter = "yaml"

[[language-servers]]
name = "yaml-language-server"
command = "yaml-language-server"
args = ["--stdio"]
install-hint = "npm i -g yaml-language-server"

[language-servers.settings.yaml.schemas]
"https://raw.githubusercontent.com/compose-spec/compose-go/v2.16.2/schema/compose-spec.json" = [
  "compose.yml",
  "compose.yaml",
  "compose.*.yml",
  "compose.*.yaml",
  "docker-compose.yml",
  "docker-compose.yaml",
  "docker-compose.*.yml",
  "docker-compose.*.yaml",
  "*-compose.yml",
  "*-compose.yaml",
  "*-compose.*.yml",
  "*-compose.*.yaml",
  "*.compose.yml",
  "*.compose.yaml",
  "*.compose.*.yml",
  "*.compose.*.yaml",
]
