id = "svelte"
name = "Svelte"
extensions = ["svelte"]
block-comment = ["<!--", "-->"]
indent = { tab-size = 2, insert-spaces = true }
# No Svelte mode ships with @codemirror/language-data; the HTML mode already
# parses <script> as TypeScript and <style> as CSS, so components get highlighted.
ui-mode = "HTML"

[[language-servers]]
name = "svelte-language-server"
command = "svelteserver"
args = ["--stdio"]
root-markers = ["svelte.config.js", "svelte.config.mjs", "svelte.config.ts", "package.json"]
install-hint = "npm i -g svelte-language-server"
