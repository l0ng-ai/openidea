id = "graphql"
name = "GraphQL"
formatter = { tool = "prettier", parser = "graphql", range = true }
extensions = ["graphql", "graphqls", "gql"]
line-comment = "#"
indent = { tab-size = 2, insert-spaces = true }
tree-sitter = "graphql"

[[language-servers]]
name = "graphql-lsp"
command = "graphql-lsp"
args = ["server", "-m", "stream"]
root-markers = [".graphqlrc", ".graphqlrc.yml", ".graphqlrc.yaml", ".graphqlrc.json", "graphql.config.js", "graphql.config.ts", "graphql.config.yml"]
install-hint = "npm i -g graphql-language-service-cli"
