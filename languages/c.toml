id = "c"
name = "C"
extensions = ["c", "h"]
line-comment = "//"
block-comment = ["/*", "*/"]
indent = { tab-size = 4, insert-spaces = true }
ui-mode = "C"
tree-sitter = "c"
scratch-template = '''
#include <stdio.h>

int main(void) {
    $END$
    return 0;
}
'''

[[language-servers]]
name = "clangd"
command = "clangd"
args = ["--background-index", "--header-insertion=never"]
root-markers = ["compile_commands.json", "compile_flags.txt", ".clangd", "CMakeLists.txt", "meson.build", "Makefile"]
install-hint = "Install clangd (LLVM): brew install llvm, apt install clangd, or https://clangd.llvm.org/installation"

[debugger]
adapter = "lldb-dap"
command = "lldb-dap"
install-hint = "Install LLVM's lldb-dap (brew install llvm), or on macOS use the one found by xcrun -f lldb-dap"
