id = "mdx"
name = "MDX"
formatter = { tool = "prettier", parser = "mdx", range = false }
extensions = ["mdx"]
# MDX 2+ has no HTML comments; `{/* */}` is a JSX expression comment.
block-comment = ["{/*", "*/}"]
indent = { tab-size = 2, insert-spaces = true }
# Prose highlighting, outline and folding come from Markdown.
ui-mode = "Markdown"
tree-sitter = "markdown"

# The launcher adds `typescript.tsdk`: the TypeScript vtsls uses.
[[language-servers]]
name = "mdx-language-server"
command = "mdx-language-server"
args = ["--stdio"]
root-markers = ["tsconfig.json", "jsconfig.json", "package.json"]
install-hint = "npm i -g @mdx-js/language-server typescript@6"
initialization-options = { typescript = { enabled = true } }
