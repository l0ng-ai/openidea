id = "helm-template"
name = "Helm Template"
extensions = ["tpl", "gotmpl"]
line-comment = "#"
block-comment = ["{{/*", "*/}}"]
indent = { tab-size = 2, insert-spaces = true }
ui-mode = "Helm Template"

# Helm charts: YAML, template and notes files in a `templates` folder.
# No YAML formatter or strict YAML language server: Go `{{ … }}` actions are
# not valid YAML until rendered by `helm template`.
[[framework-files]]
folder = "templates"
extensions = ["yaml", "yml", "tpl", "txt"]
root-markers = ["Chart.yaml", "Chart.yml"]
