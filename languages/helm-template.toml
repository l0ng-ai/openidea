id = "helm-template"
name = "Helm Template"
line-comment = "#"
block-comment = ["{{/*", "*/}}"]
indent = { tab-size = 2, insert-spaces = true }
ui-mode = "Helm Template"

# Helm charts: YAML, templates and notes in the chart's `templates` folder.
[[framework-files]]
folder = "templates"
extensions = ["yaml", "yml", "json", "tpl", "txt", "gotmpl", "tmpl"]
root-markers = ["Chart.yaml", "Chart.yml"]
root-marker-in-parent = true

[[language-servers]]
name = "helm-ls"
command = "helm_ls"
args = ["serve"]
root-markers = ["Chart.yaml"]
require-root-marker = true
install-hint = "https://github.com/mrjosh/helm-ls/releases/tag/v0.5.4"
