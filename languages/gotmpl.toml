id = "gotmpl"
name = "Go Template"
extensions = ["gotmpl", "tmpl"]
block-comment = ["{{/*", "*/}}"]
ui-mode = "Go Template"

[[language-servers]]
name = "gopls"
command = "gopls"
initialization-options = { semanticTokens = true, vulncheck = "Imports", hints = { constantValues = true } }
root-markers = ["go.work", "go.mod"]
install-hint = "go install golang.org/x/tools/gopls@latest"
