id = "css"
name = "CSS"
formatter = { tool = "prettier", parser = "css", range = false }
extensions = ["css", "pcss", "postcss"]
block-comment = ["/*", "*/"]
indent = { tab-size = 2, insert-spaces = true }
ui-mode = "CSS"
tree-sitter = "css"

[[language-servers]]
name = "vscode-css-language-server"
command = "vscode-css-language-server"
args = ["--stdio"]
initialization-options = { provideFormatter = true, css = {}, scss = {}, less = {} }
install-hint = "npm i -g vscode-langservers-extracted"

# Biome: lint diagnostics, quick fixes and fix-all below a Biome configuration or installation,
# from the project's own biome. Formatting is Reformat Code's (Settings › Biome).
[[language-servers]]
name = "biome"
command = "biome"
args = ["lsp-proxy"]
root-markers = ["biome.json", "biome.jsonc", "node_modules/@biomejs/biome"]
require-root-marker = true
features = ["code-action", "diagnostics"]
install-hint = "npm i -D @biomejs/biome"

# Stylelint: only below a project's Stylelint configuration; the server runs the project's own
# stylelint. Diagnostics, quick fixes and fix-all (Code Cleanup, Actions on Save) only: the
# server's formatting applies the same fixes, and Reformat Code stays the formatter's.
[[language-servers]]
name = "stylelint"
command = "stylelint-language-server"
args = ["--stdio"]
root-markers = [".stylelintrc", ".stylelintrc.json", ".stylelintrc.yaml", ".stylelintrc.yml", ".stylelintrc.js", ".stylelintrc.cjs", ".stylelintrc.mjs", ".stylelintrc.ts", ".stylelintrc.cts", ".stylelintrc.mts", "stylelint.config.js", "stylelint.config.cjs", "stylelint.config.mjs", "stylelint.config.ts", "stylelint.config.cts", "stylelint.config.mts", "package.json#stylelint"]
require-root-marker = true
features = ["code-action", "diagnostics"]
install-hint = "npm i -g @stylelint/language-server"

# Read as section `stylelint`: the languages it lints (its default is CSS only).
[language-servers.settings]
validate = ["css", "scss", "less"]
snippet = ["css", "scss", "less"]

# Tailwind CSS: class completion, hover and diagnostics, only in a project that uses Tailwind
# (`tailwind.config.*` or `tailwindcss` in package.json). After the language's own servers,
# which answer hover first.
[[language-servers]]
name = "tailwindcss-language-server"
command = "tailwindcss-language-server"
args = ["--stdio"]
root-markers = ["tailwind.config.*", "package.json#dependencies.tailwindcss", "package.json#devDependencies.tailwindcss"]
require-root-marker = true
install-hint = "npm i -g @tailwindcss/language-server"
