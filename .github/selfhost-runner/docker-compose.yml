# Self-hosted GitHub Actions runners (persistent & scalable).
# See README.md in this directory for setup, scaling, and troubleshooting.

services:
  github-runner:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    deploy:
      replicas: ${RUNNER_COUNT:-4}

    environment:
      RUNNER_SCOPE: repo
      REPO_URL: ${REPO_URL:-https://github.com/l0ng-ai/openidea}
      # Only needed the first time a new slot registers; registered slots reuse saved credentials.
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-myrunner-mac}
      LABELS: ${RUNNER_LABELS:-local}
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"

    # Claim an exclusive numeric slot (1..N) via flock so each replica gets its own
    # persistent runner credentials, workspace, Cargo target/home, rustup, pnpm store, and toolcache.
    entrypoint:
      - /bin/bash
      - -ec
      - |
        mkdir -p /persist/slots /persist/shared/npm-cache
        SLOT=1
        while true; do
          exec 99>"/persist/slots/slot-$${SLOT}.lock"
          if flock -n 99; then break; fi
          SLOT=$$((SLOT + 1))
        done
        SLOT_DIR="/persist/slot-$${SLOT}"
        mkdir -p "$${SLOT_DIR}"/{runner-data,work,cargo,cargo-target,rustup,pnpm-store,cache,toolcache}
        if [[ ! -f "$${SLOT_DIR}/runner-data/.runner" && -z "$${RUNNER_TOKEN:-}" ]]; then
          echo "ERROR: Slot $${SLOT} ($${RUNNER_NAME_PREFIX:-myrunner-mac}-$${SLOT}) is not registered yet; set RUNNER_TOKEN to register it." >&2
          exit 1
        fi
        rm -rf /opt/hostedtoolcache /root/.cache
        ln -s "$${SLOT_DIR}/toolcache" /opt/hostedtoolcache
        ln -s "$${SLOT_DIR}/cache" /root/.cache
        export CONFIGURED_ACTIONS_RUNNER_FILES_DIR="$${SLOT_DIR}/runner-data"
        export RUNNER_NAME="$${RUNNER_NAME_PREFIX:-myrunner-mac}-$${SLOT}"
        export RUNNER_WORKDIR="$${SLOT_DIR}/work"
        export CARGO_HOME="$${SLOT_DIR}/cargo"
        export RUSTUP_HOME="$${SLOT_DIR}/rustup"
        export CARGO_TARGET_DIR="$${SLOT_DIR}/cargo-target"
        export npm_config_store_dir="$${SLOT_DIR}/pnpm-store"
        export npm_config_cache="/persist/shared/npm-cache"
        export PATH="$${CARGO_HOME}/bin:$${PATH}"
        exec /entrypoint.sh "$$@"
      - --
    command: ["./bin/Runner.Listener", "run", "--startuptype", "service"]

    volumes:
      - runner-persist:/persist

volumes:
  runner-persist:
