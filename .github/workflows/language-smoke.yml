name: Language smoke
# Everyday code intelligence (completion, go to definition, Find Usages, hover, diagnostics
# with a quick fix, an intention, formatting, rename) per language, against the language
# server the app starts by default: crates/ide-host/tests/language_smoke.rs.
# Opening the fixture with its build tool and SDK (Maven / Gradle sync, the virtualenv, the
# JDK): the ignored tests of crates/ide-host/tests/project_smoke.rs.
# Then running and testing each fixture through the run store and openidea-server
# (Run, Run tests, the test tree, Rerun Failed Tests): smoke/run.test.ts; and debugging its
# entry point with the debugger the IDE installs (breakpoint, frames, variables, evaluate,
# Step Over, Resume): smoke/debug.test.ts.
# TypeScript, Java and Kotlin also restart their server and take an external file change, and
# Java and Kotlin import a multi-module project; their steps are in .github/actions/smoke-leg.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-smoke-${{ github.ref }}
  # A new push supersedes a PR's run; on main every merge runs to the end (and saves the cache).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Whether a pull request touches anything the smoke can see, so unaffected ones (docs, UI
  # only) skip the legs instead of waiting on a path-filtered workflow that never starts.
  # Pushes and manual runs always run everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      smoke: ${{ steps.classify.outputs.smoke }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > files.txt
          cat files.txt
          # The Rust code embeds files from java/ and from a few places under src/ (see ci.yml).
          relevant='^(crates/|languages/|fixtures/|java/|wit/|plugins/|\.cargo/|smoke/|scripts/ci/|src/features/run/|src/features/debugger/|src/platform/|src/bindings\.ts$|src/styles/tokens\.css$|src/features/plugins/views/frame-bridge\.js$|Cargo\.toml$|Cargo\.lock$|rust-toolchain|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/language-smoke\.yml$|\.github/actions/smoke-leg/|\.github/tool-versions\.env$)'
          smoke=false
          if grep -Eq "$relevant" files.txt; then smoke=true; fi
          echo "smoke=$smoke"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"

  # TypeScript, Java and Kotlin: the legs behind the `Real servers` check.
  smoke:
    name: Language smoke (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: typescript, tests: "typescript typescript_restart typescript_external_change" }
          - { language: java, tests: "java java_restart java_external_change java_multimodule" }
          - { language: kotlin, tests: "kotlin kotlin_restart kotlin_external_change kotlin_multimodule" }
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/smoke-leg
        with:
          language: ${{ matrix.language }}
          tests: ${{ matrix.tests }}

  # The other languages: same legs, not part of the `Real servers` check.
  smoke-other:
    name: Language smoke (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: python, tests: python }
          - { language: rust, tests: rust }
          - { language: go, tests: go }
          - { language: php, tests: php }
          - { language: c, tests: c }
          - { language: cpp, tests: cpp }
    # C/C++ debug with GDB, whose DAP interpreter needs 14+: 22.04 ships 12.1, 24.04 ships 15.
    runs-on: ${{ (matrix.language == 'c' || matrix.language == 'cpp') && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/smoke-leg
        with:
          language: ${{ matrix.language }}
          tests: ${{ matrix.tests }}

  # Advisory: Windows is the platform most bug reports come from and nothing has run these legs
  # there before. Not in `Real servers`; a maintainer adds it once the legs are stable.
  smoke-windows:
    name: Language smoke Windows (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: typescript, tests: "typescript typescript_restart typescript_external_change" }
          - { language: java, tests: "java java_restart java_external_change java_multimodule" }
          - { language: kotlin, tests: "kotlin kotlin_restart kotlin_external_change kotlin_multimodule" }
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      # Before checkout: fixtures and scripts are LF (a CRLF bash script does not run).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ./.github/actions/smoke-leg
        with:
          language: ${{ matrix.language }}
          tests: ${{ matrix.tests }}

  # The one check to require in the repo ruleset (Settings > Rules > main > Require status
  # checks): `Real servers`. Matrix job names are not stable, this one is. It passes when the
  # TypeScript, Java and Kotlin legs passed, or were skipped because the pull request touched
  # nothing they cover; it fails when one failed or was cancelled.
  real-servers:
    name: Real servers
    needs: [changes, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.smoke.result }}
        run: |
          echo "changes, smoke: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::the real-server legs did not pass ($result)"; exit 1 ;;
            esac
          done
