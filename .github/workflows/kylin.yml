name: Kylin build

# Builds OpenIDEA for Kylin / domestic Linux desktops (x86_64 and arm64).
#
# The produced packages are self-contained: they carry the glibc, GTK and
# WebKitGTK 4.1 runtime the app was built against and start through the bundled
# loader. Kylin V10 SP1 (glibc 2.31, webkit2gtk 4.0 only) therefore needs
# nothing beyond a working X11 or Wayland desktop.
#
# The Java support jars (java-usages, kotlin-bridge, lombok) are compiled into
# the binary, so they ship with every package automatically.
#
# Triggers:
#   - manual run (Actions -> Kylin build -> Run workflow)
#   - push to the `kylin` branch
#   - push of a `kylin-v*` tag (also publishes a release)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag or SHA). Empty = the selected branch."
        required: false
        type: string
      release:
        description: "Publish the packages as a GitHub release"
        required: false
        type: boolean
        default: false
  push:
    branches: [kylin]
    tags: ["kylin-v*"]

permissions:
  contents: write

concurrency:
  group: kylin-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: read
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Kylin ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            appimage_arch: x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            appimage_arch: aarch64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: kylin-${{ matrix.target }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            libgbm1 \
            libgl1 \
            libegl1 \
            libgl1-mesa-dri \
            fonts-dejavu-core \
            dbus-x11 \
            xauth \
            xvfb

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Only the .deb is built here: the bundler below rewrites it into the
      # self-contained package and produces the AppDir for appimagetool.
      # Kylin packages are distributed outside the upstream updater, so the
      # build skips updater artifacts (which would otherwise need a signing key).
      - name: Build
        run: |
          pnpm tauri build \
            --target ${{ matrix.target }} \
            --bundles deb \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Bundle the runtime
        run: |
          version='${{ needs.version.outputs.version }}'
          arch='${{ matrix.arch }}'
          deb=$(find "target/${{ matrix.target }}/release/bundle/deb" -name '*.deb' -print -quit)
          test -n "$deb"
          rm -rf kylin-dist
          mkdir -p kylin-dist
          bash scripts/kylin/bundle-runtime.sh "$arch" "$deb" kylin-dist
          test -f "kylin-dist/openidea_${version}_kylin_${arch}.deb"
          test -d "kylin-dist/AppDir-${arch}"

      - name: Build AppImage
        run: |
          version='${{ needs.version.outputs.version }}'
          arch='${{ matrix.arch }}'
          appimage_arch='${{ matrix.appimage_arch }}'
          tools=$(mktemp -d)
          curl -fsSL -o "$tools/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${appimage_arch}.AppImage"
          curl -fsSL -o "$tools/runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${appimage_arch}"
          chmod +x "$tools/appimagetool"
          ARCH="$appimage_arch" "$tools/appimagetool" --appimage-extract-and-run --no-appstream \
            --runtime-file "$tools/runtime" \
            "kylin-dist/AppDir-${arch}" "kylin-dist/OpenIDEA_${version}_kylin_${arch}.AppImage"
          rm -rf "kylin-dist/AppDir-${arch}"
          test -s "kylin-dist/OpenIDEA_${version}_kylin_${arch}.AppImage"

      - name: Verify packages
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          arch='${{ matrix.arch }}'
          deb="kylin-dist/openidea_${version}_kylin_${arch}.deb"
          appimage="kylin-dist/OpenIDEA_${version}_kylin_${arch}.AppImage"
          root=$(mktemp -d)
          dpkg-deb -R "$deb" "$root"
          app="$root/usr/lib/openidea"

          echo "== control =="
          cat "$root/DEBIAN/control"

          # The whole point of the bundle: no webkit2gtk-4.1 dependency.
          if grep -q 'libwebkit2gtk-4.1' "$root/DEBIAN/control"; then
            echo "::error::the package still depends on libwebkit2gtk-4.1"
            exit 1
          fi

          test -x "$root/usr/bin/openidea"
          test -x "$app/openidea"
          test -f "$app/runtime/lib/libwebkit2gtk-4.1.so.0"
          test -f "$app/runtime/lib/libjavascriptcoregtk-4.1.so.0"
          test -x "$app/runtime/libexec/webkit2gtk-4.1/WebKitWebProcess"
          test -x "$app/runtime/libexec/webkit2gtk-4.1/WebKitNetworkProcess"
          test -f "$app/runtime/libexec/webkit2gtk-4.1/injected-bundle/libwebkit2gtkinjectedbundle.so"

          echo "== embedded Java plugins =="
          for jar in java-usages-1.12.0.jar kotlin-bridge-1.0.0.jar lombok-1.18.48-openidea.3.jar; do
            if ! grep -qa "$jar" "$app/openidea"; then
              echo "::error::$jar is not embedded in the binary"
              exit 1
            fi
            echo "  $jar"
          done

          echo "== runtime closure =="
          loader=$(find "$app/runtime/lib" -maxdepth 1 -name 'ld-linux-*.so.*' | head -1)
          test -n "$loader"
          "$loader" --library-path "$app/runtime/lib" --list "$app/openidea" > /tmp/ldd.txt
          if grep -q 'not found' /tmp/ldd.txt; then
            echo "::error::the bundled runtime does not resolve every library"
            grep 'not found' /tmp/ldd.txt
            exit 1
          fi
          grep -c . /tmp/ldd.txt | sed 's/^/  resolved libraries: /'

          echo "== AppImage =="
          "$appimage" --appimage-offset > /dev/null
          ls -lh kylin-dist

      # Starts the real app against the bundled runtime with no system
      # webkit2gtk-4.1 present. A machine without a GPU uses Mesa's software
      # renderer, which is what the runner and Kylin VMs do.
      - name: Smoke test
        run: |
          version='${{ needs.version.outputs.version }}'
          arch='${{ matrix.arch }}'
          root=$(mktemp -d)
          dpkg-deb -R "kylin-dist/openidea_${version}_kylin_${arch}.deb" "$root"
          export HOME=$(mktemp -d)
          set +e
          timeout 60 xvfb-run -a dbus-run-session -- "$root/usr/bin/openidea" > /tmp/smoke.log 2>&1
          rc=$?
          set -e
          sed -n '1,80p' /tmp/smoke.log
          # 124 means it was still running when the timeout fired: that is a pass.
          if grep -q 'application data directories' /tmp/smoke.log; then
            echo "::notice::the app started with the bundled runtime (exit $rc)"
          else
            echo "::error::the app did not start"
            exit 1
          fi

      - name: Collect packages
        run: |
          out=kylin-dist
          (cd "$out" && sha256sum -- *.deb *.AppImage > SHA256SUMS)
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: openidea-kylin-${{ matrix.arch }}
          path: kylin-dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/kylin-v')) || inputs.release }}
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('kylin-v{0}', needs.version.outputs.version) }}
          name: OpenIDEA ${{ needs.version.outputs.version }} for Kylin
          body: |
            OpenIDEA ${{ needs.version.outputs.version }} for Kylin / domestic Linux.

            - `amd64` (x86_64) and `arm64` (aarch64) .deb packages
            - AppImage for both architectures
            - `SHA256SUMS` for integrity checks

            **Self-contained runtime.** The packages carry the glibc, GTK and
            WebKitGTK 4.1 runtime they were built against and start through the
            bundled loader. Kylin V10 SP1 (glibc 2.31, webkit2gtk 4.0 only)
            needs no extra packages: install the .deb or run the AppImage on a
            machine with a working X11 or Wayland desktop.

            **Java support included.** The java-usages, kotlin-bridge and
            lombok jars are compiled into the binary; no separate download is
            needed.

            Notes:

            - The WebKit sandbox is disabled by default because it cannot see
              an AppImage mount. Set `OPENIDEA_WEBKIT_SANDBOX=1` to keep it in
              a regular installation.
            - GPU drivers still come from the host. Without a GPU the app falls
              back to Mesa's software renderer, so `libgl1-mesa-dri` should be
              installed on machines without one.
          files: dist/*
          fail_on_unmatched_files: true
