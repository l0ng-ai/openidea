name: PR build
# Debug app binaries for pull requests, downloadable from the run's
# "Artifacts" section. release.yml builds the signed installers on tags only.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pr-build-${{ github.ref }}
  # A newer push supersedes the run in progress.
  cancel-in-progress: true

jobs:
  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      # Only main saves the cache (saving takes minutes on Windows); PRs restore main's.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      # beforeBuildCommand (pnpm build) produces the frontendDist tauri-build embeds.
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: openidea-${{ matrix.os }}-debug
          path: target/debug/openidea*
          retention-days: 7
          if-no-files-found: error
