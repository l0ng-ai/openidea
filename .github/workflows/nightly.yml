name: Nightly

# Twice a day, builds the newest main commit that passed CI with a nightly version, into the one
# `nightly` prerelease: its installers, the manifest the nightly app updates from, and the remote
# development servers of recent builds, named by version so an app not yet updated still finds
# its own. The `nightly` tag marks the commit last built, and a run with nothing newer stops there.
on:
  schedule:
    - cron: "17 2,14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing is newer than the last nightly"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    permissions:
      actions: read
      contents: write
    if: github.repository == 'l0ng-ai/openidea'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - id: commit
        env:
          FORCE: ${{ inputs.force }}
        run: |
          sha="$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 \
            --json headSha --jq '.[0].headSha // ""')"
          if [ -z "$sha" ]; then
            echo "::notice::no main commit has passed CI"
            exit 0
          fi
          # No `nightly` tag yet (the first run): compare fails and the build goes on.
          status="$(gh api "repos/$GH_REPO/compare/nightly...$sha" --jq .status 2>/dev/null)" || status=ahead
          if [ "$status" != ahead ] && [ "$FORCE" != true ]; then
            echo "::notice::$sha is not newer than the last nightly"
            exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.commit.outputs.sha != ''
        with: { ref: "${{ steps.commit.outputs.sha }}" }
      - uses: actions/setup-node@v5
        if: steps.commit.outputs.sha != ''
        with: { node-version: 22 }
      # The build goes into a draft, which nobody else sees, until `publish` moves it into `nightly`.
      - id: release
        if: steps.commit.outputs.sha != ''
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          stamp="$(date -u +%Y%m%d%H%M)"
          version="$(node scripts/nightly-prepare.ts "$stamp" --print)"
          tag="nightly-build-$stamp"
          id="$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$tag" -f target_commitish="$SHA" \
            -f name="OpenIDEA Nightly $version" -F draft=true -F prerelease=true -f body="Built from $SHA." --jq .id)"
          { echo "version=$version"; echo "tag=$tag"; echo "id=$id"; } >> "$GITHUB_OUTPUT"

  binaries:
    permissions:
      contents: write
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      release_id: ${{ needs.prepare.outputs.release_id }}
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      download_tag: nightly
    secrets: inherit

  publish:
    permissions:
      contents: write
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    env:
      DRAFT: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
      KEEP: 14
    steps:
      - name: Move the build into the nightly release
        run: |
          dir="$RUNNER_TEMP/build"
          gh release download "$DRAFT" -D "$dir"
          gh release view nightly >/dev/null 2>&1 ||
            gh release create nightly --prerelease --latest=false --target "$SHA" --title "OpenIDEA Nightly" --notes ""
          # This build's own files first; then the ones every build replaces (the macOS update
          # archives), and last the manifest that points at them.
          shopt -s nullglob
          own=() shared=()
          for f in "$dir"/*; do
            case "$(basename "$f")" in
              latest.json) ;;
              *"$VERSION"*) own+=("$f") ;;
              *) shared+=("$f") ;;
            esac
          done
          gh release upload nightly "${own[@]}" --clobber
          [ ${#shared[@]} -eq 0 ] || gh release upload nightly "${shared[@]}" --clobber
          [ ! -f "$dir/latest.json" ] || gh release upload nightly "$dir/latest.json" --clobber
          gh release edit nightly --notes "OpenIDEA $VERSION, built from $SHA."
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true --silent
      # Earlier builds' installers go; their servers stay for the latest $KEEP builds, for
      # apps not updated yet. Build drafts go too, this one and those of failed builds.
      - name: Delete old builds
        run: |
          stamp="${VERSION##*-nightly.}"
          assets="$RUNNER_TEMP/assets"
          id="$(gh api "repos/$GH_REPO/releases/tags/nightly" --jq .id)"
          gh api --paginate "repos/$GH_REPO/releases/$id/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"' > "$assets"
          keep="$(grep -oE '^[0-9]+ openidea-server-.*-nightly\.[0-9]{12}' "$assets" | grep -oE '[0-9]{12}$' | sort -ru | head -n "$KEEP")"
          while read -r asset name; do
            built="$(grep -oE -- '-nightly\.[0-9]{12}' <<<"$name" | grep -oE '[0-9]{12}')" || continue
            [ "$built" != "$stamp" ] || continue
            case "$name" in openidea-server-*) ! grep -qx "$built" <<<"$keep" || continue ;; esac
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset" --silent
          done < "$assets"
          gh release list --limit 200 --json tagName --jq '.[].tagName | select(test("^nightly-build-|-nightly\\."))' |
            while read -r tag; do
              gh release delete "$tag" --yes
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" --silent 2>/dev/null || true
            done
