name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please write the title and description **in English** so every contributor can follow. Machine translation is fine, and you can add your original text below the English version. One request per issue, please.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched [existing issues](https://github.com/l0ng-ai/openidea/issues?q=is%3Aissue) and this hasn't been requested yet.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Mockups or examples from other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other approaches you considered, or what you do now instead.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
