[package]
name = "ide-tools"
description = "Installer for language servers and debug adapters: registry, detection, download/extract, managed tools dir"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ide-core.workspace = true
ide-language.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
parking_lot.workspace = true
http = "1"
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-proxy-system"] }
tracing.workspace = true
which = "8"
blake3.workspace = true
flate2 = "1"
tar = "0.4"
zip.workspace = true
sha2 = "0.10"
hex = "0.4"
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
