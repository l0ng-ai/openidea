[package]
name = "ide-mcp"
description = "The IDE's MCP server: Streamable HTTP on 127.0.0.1 for AI agents outside the IDE, its discovery file and the stdio bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1"
dunce.workspace = true
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-std"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-std", "rt-multi-thread", "macros"] }
