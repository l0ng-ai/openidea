[package]
name = "ide-mcp"
description = "The built-in MCP server: exposes the IDE's files, search, code insight, VCS, runs and terminal to external AI agents over streamable HTTP on 127.0.0.1"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ide-core.workspace = true
ide-host.workspace = true
ide-lsp.workspace = true
ide-workspace.workspace = true
ide-vfs.workspace = true
ide-search.workspace = true
ide-index.workspace = true
ide-run.workspace = true
ide-build.workspace = true
ide-vcs.workspace = true
ide-terminal.workspace = true
ide-syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
parking_lot.workspace = true
futures.workspace = true
uuid.workspace = true
dunce.workspace = true
globset.workspace = true
toml.workspace = true
toml_edit.workspace = true
regex-lite = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }
ide-language.workspace = true
