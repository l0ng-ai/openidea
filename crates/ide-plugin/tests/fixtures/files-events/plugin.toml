id = "files-events"
name = "Filesystem events test"
version = "0.1.0"
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-command:*", "on-event:files-changed"]

[capabilities]
required = ["events", "storage"]
optional = ["project.read"]

[[contributes.commands]]
id = "events"
title = "Read filesystem events"

[[contributes.commands]]
id = "filter"
title = "Filter filesystem events"

[[contributes.commands]]
id = "unsubscribe"
title = "Unsubscribe from filesystem events"
