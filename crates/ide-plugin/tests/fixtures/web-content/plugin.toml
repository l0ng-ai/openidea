id = "web-content"
name = "Web Content Probe"
version = "0.1.0"
description = "Test fixture for a plugin-backed content editor tab with custom toolbar actions."
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-command:ping", "on-command:open"]

[[contributes.views]]
id = "inspector"
title = "Content Probe"
icon = "file-code"
location = "right"
web = "web/index.html"

[[contributes.commands]]
id = "ping"
title = "Content Probe: Ping"

[[contributes.commands]]
id = "open"
title = "Content Probe: Open Editor Tab"
