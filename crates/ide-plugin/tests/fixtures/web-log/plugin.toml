id = "web-log"
name = "Web Log Probe"
version = "0.1.0"
description = "Test fixture for a capability-gated streaming editor tab."
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-command:ping", "on-command:open", "on-command:denied", "on-command:code"]

[capabilities]
optional = ["process:bash"]

[[contributes.views]]
id = "logs"
title = "Log Probe"
icon = "file-log"
location = "right"
web = "web/index.html"

[[contributes.commands]]
id = "ping"
title = "Log Probe: Ping"

[[contributes.commands]]
id = "open"
title = "Log Probe: Open Stream"

[[contributes.commands]]
id = "denied"
title = "Log Probe: Try Undeclared Program"

[[contributes.commands]]
id = "code"
title = "Log Probe: Open From Code"
