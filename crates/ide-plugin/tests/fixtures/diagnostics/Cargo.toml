[package]
name = "openidea-test-diagnostics"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
diagnostics-first = []
diagnostics-last = []

[dependencies]
openidea-plugin = { path = "../../../../../sdk/rust/openidea-plugin" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
