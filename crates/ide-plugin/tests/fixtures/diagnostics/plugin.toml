id = "test.diagnostics"
name = "Diagnostics fixture"
version = "0.1.0"
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
[capabilities]
required = ["project.read"]

[[contributes.providers]]
kinds = ["diagnostics"]
