id = "test.language-features"
name = "Language features fixture"
version = "0.1.0"
engines.openidea = "^1.4"
wasm = "dist/plugin.wasm"

[[contributes.providers]]
kinds = ["formatting", "signature-help", "document-highlights", "document-links", "code-lenses", "selection-ranges", "folding", "colors", "document-symbols", "implementation", "type-definition", "gutter-actions", "injections"]
languages = ["plaintext", "text", "sql"]

[[contributes.providers]]
kinds = ["completion", "hover", "diagnostics"]
languages = ["sql"]

[[contributes.commands]]
id = "run"
title = "Run fixture"
icon = "run"

[[contributes.commands]]
id = "state"
title = "Fixture state"

[[contributes.snippets]]
language = "sql"
path = "snippets.json"

[[contributes.menus]]
menu = "editor.title"
command = "run"
when = "editorLangId == sql"
