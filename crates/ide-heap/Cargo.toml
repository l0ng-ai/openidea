[package]
name = "ide-heap"
description = "HotSpot .hprof parser and heap-snapshot analysis for the debugger's JVM Memory view"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ide-core.workspace = true
memmap2.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# `testing`: the `.hprof` fixture builders, for tests and benches of this crate and of crates built on it.
testing = []

[dev-dependencies]
# Self dev-dependency: turns `testing` on for this crate's benches, so a plain `cargo bench -p ide-heap` builds them.
ide-heap = { workspace = true, features = ["testing"] }
criterion = { version = "0.5", default-features = false }
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "heap"
harness = false
