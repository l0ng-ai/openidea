[package]
name = "ide-ssh"
description = "SSH connections: configurations, host keys, authentication, remote commands, SFTP and FTP files, port forwarding and askpass"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ide-core.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
dirs.workspace = true
uuid.workspace = true
keyring.workspace = true
keyring-core.workspace = true
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "2.4"
flate2 = "1"
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-ring"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
tokio-rustls = { version = "0.26", default-features = false }

[features]
# `testing`: an in-process SSH / SFTP server for tests of crates built on this one,
# and an in-memory credential store in place of the OS one.
testing = ["keyring-core/sample"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
keyring-core = { workspace = true, features = ["sample"] }
