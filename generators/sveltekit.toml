id = "sveltekit"
name = "SvelteKit"
group = "JavaScript"
icon = "project-sveltekit"
order = 5
description = "A SvelteKit app from the Svelte CLI."

[[requires]]
program = "node"
min = "20.19"
hint = "Install Node.js 20.19 or later: https://nodejs.org"

[[requires]]
program = "{{pm}}"
when = { pm = ["pnpm", "yarn", "bun"] }
hint = "Install it, or choose npm."

[[fields]]
id = "template"
label = "Template:"
type = "choice"
segmented = true
options = [{ value = "minimal", label = "Minimal" }, { value = "demo", label = "Demo" }, { value = "library", label = "Library" }]
default = "minimal"

[[fields]]
id = "types"
label = "Type checking:"
type = "choice"
segmented = true
options = [{ value = "ts", label = "TypeScript" }, { value = "jsdoc", label = "JSDoc" }]
default = "ts"

[[fields]]
id = "pm"
label = "Package manager:"
type = "choice"
segmented = true
options = ["npm", "pnpm", "yarn", "bun"]
default = "npm"

[[fields]]
id = "install"
label = "Install dependencies"
type = "checkbox"
default = "true"

[[steps]]
label = "Running sv create"
package = "sv@latest"
cwd = "parent"
args = ["create", "{{name}}", "--template", "{{template}}", "--types", "{{types}}", "--no-add-ons", "--no-install"]

[[after]]
label = "Installing dependencies"
program = "{{pm}}"
args = ["install"]
when = { install = "true" }
