id = "openidea.string-tools"
name = "String Tools"
version = "0.1.0"
description = "Case conversion (camelCase, snake_case, kebab-case…), encoding (Base64, URL, HTML, JSON), line sorting and more, on every selection at once."
authors = ["OpenIDEA contributors"]
license = "Apache-2.0"
change-notes = "0.1.0 — first release: 26 commands in four groups."
engines.openidea = "^1.0"
wasm = "dist/plugin.wasm"
# The commands are declared below, so Find Action and the keymap list them
# before the code is ever loaded; it loads on the first one run.
activation = ["on-command:*"]

[capabilities]
required = ["editor.read", "editor.write"]

[[contributes.commands]]
id = "camel-case"
title = "String Tools: To camelCase"
category = "String Tools › Case"
when = "editorFocus"

[[contributes.commands]]
id = "pascal-case"
title = "String Tools: To PascalCase"
category = "String Tools › Case"
when = "editorFocus"

