id = "openidea.zig"
name = "Zig Build"
version = "0.1.0"
description = "Zig build steps and executables from build.zig, and dependencies from build.zig.zon, in a Zig tool window: run a step in the Zig Build terminal, or open its source."
authors = ["OpenIDEA contributors"]
license = "Apache-2.0"
change-notes = "0.1.0 — first release: Zig tool window with build steps, executables and package dependencies; runs steps in a dedicated terminal."
categories = ["languages", "tools"]
engines.openidea = "^1.4"
wasm = "dist/plugin.wasm"
activation = ["on-view:build", "on-command:*"]

[capabilities]
# `events`: refresh the view when build.zig or build.zig.zon is saved.
required = ["project.read", "events"]
# Running `zig build <step>` in the plugin's terminal; refusing it keeps the
# view's outline and navigation working.
optional = ["process:zig"]

[[contributes.commands]]
id = "show"
title = "Zig: Show Build View"
category = "Zig"
when = "workspaceContains:build.zig"

[[contributes.commands]]
id = "refresh"
title = "Zig: Refresh Build View"
category = "Zig"
when = "workspaceContains:build.zig"

[[contributes.views]]
id = "build"
title = "Zig Build"
icon = "package"
location = "right"
when = "workspaceContains:build.zig"
