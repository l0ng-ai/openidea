id = "openidea.key-promoter"
name = "Key Promoter"
version = "0.1.0"
description = "Shows the keyboard shortcut of an action you ran with the mouse, and counts how often you could have used it."
authors = ["OpenIDEA contributors"]
license = "Apache-2.0"
change-notes = "0.1.0 — first release: shortcut tips, statistics, per-action \"don't show again\"."
engines.openidea = "^1.0"
wasm = "dist/plugin.wasm"
# Actions arrive in batches (a few seconds apart while the plugin is idle),
# so it is not woken for every click.
activation = ["on-event:action-performed", "on-command:*"]

[capabilities]
# `events.input`: which actions you run and how (keyboard, menu, toolbar…).
required = ["events.input", "storage"]

[[contributes.commands]]
id = "statistics"
title = "Key Promoter: Show Statistics"
category = "Key Promoter"

[[contributes.commands]]
id = "reset"
title = "Key Promoter: Reset Statistics"
category = "Key Promoter"

[[contributes.commands]]
id = "suppress-last"
title = "Key Promoter: Don't Show Tips for the Last Action"
category = "Key Promoter"
