apiVersion: apps/v1
kind: Deployment
metadata:
  name: $NAME$
  labels:
    app.kubernetes.io/name: $NAME$
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: $NAME$
  template:
    metadata:
      labels:
        app.kubernetes.io/name: $NAME$
    spec:
      containers:
        - name: $NAME$
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
