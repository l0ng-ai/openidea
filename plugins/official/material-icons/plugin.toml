id = "openidea.material-icons"
name = "Material Icons"
version = "0.1.0"
description = "Colourful file and folder icons on the Material palette: 100+ icons for languages, well-known files and project folders."
authors = ["OpenIDEA contributors"]
license = "Apache-2.0"
change-notes = "0.1.0 — first release: 106 icons covering 189 extensions, 71 file names and 92 folder names."
engines.openidea = "^1.0"

# Apply it in Settings › Plugins › Material Icons. The icons are generated by
# generate.py (not part of the package); edit its tables and re-run it.
[[contributes.iconThemes]]
id = "material"
label = "Material Icons"
path = "icons/theme.json"
