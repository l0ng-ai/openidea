id = "openidea.catppuccin-icons"
name = "Catppuccin Icons"
version = "0.1.0"
description = "Soothing pastel file and folder icons in the four Catppuccin flavors: Latte, Frappé, Macchiato and Mocha."
authors = ["OpenIDEA contributors", "Catppuccin"]
homepage = "https://github.com/catppuccin/vscode-icons"
license = "MIT"
change-notes = "0.1.0 — first release: 656 icons for 727 extensions, 1084 file names and 421 folder names, ported from catppuccin/vscode-icons (the source of catppuccin/jetbrains-icons)."
engines.openidea = "^1.0"

# Apply one in Settings › Plugins › Catppuccin Icons. The icons and their
# associations are generated by generate.py from catppuccin/vscode-icons (not
# part of the package); re-run it to update them.
[[contributes.iconThemes]]
id = "mocha"
label = "Catppuccin Mocha"
path = "icons/mocha/theme.json"

[[contributes.iconThemes]]
id = "macchiato"
label = "Catppuccin Macchiato"
path = "icons/macchiato/theme.json"

[[contributes.iconThemes]]
id = "frappe"
label = "Catppuccin Frappé"
path = "icons/frappe/theme.json"

[[contributes.iconThemes]]
id = "latte"
label = "Catppuccin Latte"
path = "icons/latte/theme.json"
