// OpenIDEA: runs a main class on its Gradle source set's runtime classpath, like IntelliJ
// IDEA's "Build and run using: Gradle" (ApplicationTaskInitScript.gradle). Parameters come
// as system properties so this file never changes: see `gradleRun.ts`. Works from Gradle 4.6,
// the oldest IDEA supports: `register` is Gradle 4.9+, `JavaExec.mainClass` 6.4+.
import groovy.json.JsonSlurper
import org.gradle.util.GradleVersion

def lazyTasks = GradleVersion.current() >= GradleVersion.version('4.9')

// Gradle 7.0 and older give a build JVM with its own `org.gradle.jvmargs` the command line's
// `-D` values only once the settings load, after init scripts run: read them in project actions (#4093).
allprojects { p ->
    // An identity path (`:lib:core` for a project of an included build); none: not a delegated run.
    def id = { try { p.identityPath.toString() } catch (ignored) { p.path } }
    if (id() != System.getProperty('openidea.run.project')) return
    p.plugins.withId('java') {
        def json = new JsonSlurper()
        def list = { String key -> (List) json.parseText(System.getProperty(key, '[]')) }
        def configure = { JavaExec t ->
            t.description = 'Runs a main class for OpenIDEA.'
            t.classpath = p.sourceSets.getByName(System.getProperty('openidea.run.sourceSet', 'main')).runtimeClasspath
            def main = System.getProperty('openidea.run.main')
            if (t.hasProperty('mainClass')) t.mainClass.set(main) else t.main = main
            t.args(list('openidea.run.args'))
            t.jvmArgs(list('openidea.run.jvmArgs'))
            // The IDE attaches to this JVM, not to the Gradle daemon; port 0 prints the one picked.
            if (Boolean.getBoolean('openidea.run.debug')) {
                // Opens the attach socket for the memory view, unless the VM options decide about it.
                if (Boolean.getBoolean('openidea.run.attachListener')
                        && !list('openidea.run.jvmArgs').any { it.toString().find(/StartAttachListener|DisableAttachMechanism/) != null }) {
                    t.jvmArgs('-XX:+StartAttachListener')
                }
                t.jvmArgs('-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=127.0.0.1:0')
            }
            def dir = System.getProperty('openidea.run.workingDir')
            if (dir) t.workingDir = dir
            t.standardInput = System.in
        }
        if (lazyTasks) p.tasks.register('openideaRun', JavaExec, configure)
        else p.tasks.create('openideaRun', JavaExec, configure)
    }
}
