// OpenIDEA: JavaExec-based application tasks (BootRun and a direct `run`) fork a JVM;
// give that JVM a dynamic JDWP port instead of Gradle's fixed 5005. The property is
// added by jdwpLaunch.
allprojects {
    tasks.withType(JavaExec).configureEach { task ->
        if (System.getProperty('openidea.run.debug') == 'true') {
            task.jvmArgs('-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=127.0.0.1:0')
        }
    }
}
