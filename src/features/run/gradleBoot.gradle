// OpenIDEA: BootRun is a JavaExec task; mark its forked application JVM with the run token
// and, for Debug, give it a dynamic JDWP port instead of Gradle's fixed 5005. The debug
// property is added by jdwpLaunch.
import org.gradle.util.GradleVersion
// `configureEach` (lazy) is Gradle 4.9+; older ones configure each task as it is added.
def each = { tasks, Closure action -> GradleVersion.current() >= GradleVersion.version('4.9') ? tasks.configureEach(action) : tasks.all(action) }
gradle.projectsEvaluated {
    allprojects {
        each(tasks.matching { it.name == 'bootRun' }) { task ->
            def token = System.getProperty('openidea.run.token')
            if (token) task.jvmArgs('-Dopenidea.run.token=' + token)
            if (System.getProperty('openidea.run.debug') == 'true') {
                task.debug = false
                task.doFirst {
                    task.setJvmArgs(task.jvmArgs.findAll {
                        !it.startsWith('-agentlib:jdwp=') && !it.startsWith('-Xrunjdwp:')
                    })
                    task.jvmArgs('-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=127.0.0.1:0')
                }
            }
        }
    }
}
